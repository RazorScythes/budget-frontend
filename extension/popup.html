<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Expenses</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="shell">
    <!-- Loading -->
    <section id="view-loading" class="view view-loading">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Connecting…</p>
      </div>
    </section>

    <!-- Login -->
    <section id="view-login" class="view hidden view-enter">
      <div class="login-hero">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
          </svg>
        </div>
        <h1 class="login-title">Budget Manager</h1>
        <p class="login-sub">Sign in to log daily expenses</p>
      </div>

      <form id="login-form" class="login-card card">
        <div class="field">
          <label class="field-label" for="login-username">Username</label>
          <input class="field-input" type="text" id="login-username" autocomplete="username" required />
        </div>
        <div class="field">
          <label class="field-label" for="login-password">Password</label>
          <input class="field-input" type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="alert alert-error hidden" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      </form>

      <button type="button" class="btn btn-ghost btn-block settings-link" id="open-options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Extension settings (paste client key)
      </button>
      <p class="login-footnote">Generate your client key in Budget → Settings → Tools</p>
    </section>

    <!-- Main -->
    <section id="view-main" class="view hidden view-enter">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="brand-mark brand-mark-sm" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
            </svg>
          </div>
          <div class="topbar-text">
            <h1 class="topbar-title">Log expense</h1>
            <p id="user-greeting" class="topbar-sub">Welcome</p>
          </div>
        </div>
        <button type="button" class="btn btn-icon" id="logout-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </header>

      <div class="today-strip">
        <div class="today-strip-inner">
          <div class="today-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Today
          </div>
          <div class="today-stats">
            <span id="today-total" class="today-amount">₱0.00</span>
            <span id="today-count" class="today-count">0 expenses</span>
          </div>
        </div>
      </div>

      <form id="expense-form" class="expense-card card">
        <p class="card-title">New transaction</p>
        <div class="field">
          <label class="field-label" for="exp-description">Description</label>
          <input class="field-input" type="text" id="exp-description" placeholder="Coffee, groceries, transport…" required autofocus />
        </div>
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="exp-amount">Amount</label>
            <div class="input-prefix-wrap">
              <span class="input-prefix">₱</span>
              <input class="field-input input-with-prefix" type="number" id="exp-amount" min="0" step="0.01" placeholder="0.00" required />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="exp-date">Date</label>
            <input class="field-input" type="date" id="exp-date" required />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="exp-category">Category</label>
            <select class="field-select" id="exp-category">
              <option value="">Uncategorized</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="exp-payment">Payment</label>
            <select class="field-select" id="exp-payment">
              <option>Cash</option>
              <option>GCash</option>
              <option>Bank</option>
              <option>BPI</option>
              <option>Credit Card</option>
              <option>Debit Card</option>
              <option>PayPal</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="exp-notes">Notes <em>(optional)</em></label>
          <input class="field-input" type="text" id="exp-notes" placeholder="Receipt #, location, etc." />
        </div>
        <p id="expense-error" class="alert alert-error hidden" role="alert"></p>
        <p id="expense-success" class="alert alert-success hidden" role="status"></p>
        <button type="submit" class="btn btn-primary btn-block" id="expense-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add expense
        </button>
      </form>

      <div class="recent-card card">
        <div class="recent-head">
          <p class="card-title recent-title">Logged today</p>
        </div>
        <ul id="recent-list" class="recent-list" aria-live="polite"></ul>
        <p id="recent-empty" class="recent-empty hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32" opacity="0.35"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          No expenses logged today yet
        </p>
      </div>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
